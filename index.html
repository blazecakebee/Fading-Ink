<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fading Ink — a cultivation life sim</title>
  <meta name="description" content="A life simulation where you live, cultivate, fight through Gates, and pass the torch to your children.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Lora:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;600;700;800;900&family=Orbitron:wght@500;700&family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body data-theme="amber">
  <div id="app">
    <header id="topbar" class="panel corners"></header>
    <div id="agebar" class="panel"></div>
    <main id="layout">
      <nav id="sidebar" class="panel corners" aria-label="Game sections"></nav>
      <section id="center" class="panel corners"></section>
      <aside id="right" class="panel corners"></aside>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="fx"></div>
  <div id="toasts"></div>
  <noscript>Fading Ink needs JavaScript.</noscript>
  <script>
  // Self-heal: GitHub Pages lets browsers cache files for ~10 minutes. If an update leaves a mix of old and new
  // files cached, the game can't start. Detect that, re-download every file fresh once, and reload.
  (function () {
    var errs = [], healed = sessionStorage.getItem('fi-heal');
    window.addEventListener('error', function (e) { errs.push((e.message || 'error') + (e.filename ? ' @ ' + e.filename.split('/').slice(-2).join('/') + ':' + e.lineno : '')); }, true);
    function heal() {
      sessionStorage.setItem('fi-heal', '1');
      fetch('files.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (list) {
        return Promise.all(list.map(function (u) { return fetch(u, { cache: 'reload' }).catch(function () {}); }));
      }).catch(function () {}).then(function () { location.reload(); });
    }
    function show() {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;inset:auto 20px 20px 20px;z-index:99999;background:#2a0d12;color:#ffd7d7;border:1px solid #ff6a6a;border-radius:12px;padding:14px 16px;font:14px/1.5 sans-serif;white-space:pre-wrap';
      d.textContent = 'Fading Ink could not start. Please send a screenshot of this box.\n\n' + (errs.join('\n') || 'The game scripts did not finish loading.') + '\n\n';
      var b = document.createElement('button'); b.textContent = 'Clear cache & retry'; b.style.cssText = 'padding:6px 12px;border-radius:8px;border:0;cursor:pointer';
      b.onclick = function () { sessionStorage.removeItem('fi-heal'); heal(); }; d.appendChild(b); document.body.appendChild(d);
    }
    setTimeout(function () {
      if (window.__fiBooted) { sessionStorage.removeItem('fi-heal'); return; }
      if (!healed) heal(); else show();
    }, 6000);
  })();
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
