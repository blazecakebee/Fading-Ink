<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fading Ink — a cultivation life sim</title>
  <meta name="description" content="A life simulation where you live, cultivate, fight through Gates, and pass the torch to your children.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Lora:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;600;700;800;900&family=Orbitron:wght@500;700&family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body data-theme="amber">
  <div id="app">
    <header id="topbar" class="panel corners"></header>
    <div id="agebar" class="panel"></div>
    <main id="layout">
      <nav id="sidebar" class="panel corners" aria-label="Game sections"></nav>
      <section id="center" class="panel corners"></section>
      <aside id="right" class="panel corners"></aside>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="fx"></div>
  <div id="toasts"></div>
  <noscript>Fading Ink needs JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
